<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

		<title>buddy.</title>

		<!-- Security: safe, host-independent meta tags. -->
		<meta name="referrer" content="strict-origin-when-cross-origin" />

		<!--
			Content-Security-Policy is intentionally NOT set as a <meta http-equiv>:
			the SvelteKit static build emits an inline bootstrap <script> with no
			nonce, and connect-src must allow the (build-time-unknown) backend
			origin from PUBLIC_API_BASE_URL. Set the CSP and other security headers
			at the reverse proxy / static host instead.
		-->

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
