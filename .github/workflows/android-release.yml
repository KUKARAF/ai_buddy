name: Android Release APK

# Builds a SIGNED release APK on every `v*` tag and publishes it as a GitHub
# Release.
#
# The Android Gradle project under crates/mobile/gen/ is NOT committed - it is
# regenerated here on every run by `tauri android init` (the dev machine has
# no Android SDK/NDK, and the template defaults - including the INTERNET
# permission this pure-client app needs - are sufficient for now). If the
# manifest or icons ever need customizing, generate gen/ once, commit it, and
# drop the init step plus the `crates/mobile/gen/` .gitignore entry.
#
# Signing: the generated Gradle project has no signingConfigs, so the release
# build emits an unsigned APK which is then zipaligned and signed with
# apksigner from the runner's preinstalled build-tools. This avoids patching
# a freshly generated build.gradle.kts on every run. Required repo secrets:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches tauri.conf.json version
        # Android's versionCode is derived from this version
        # (major*1_000_000 + minor*1_000 + patch) and must increase for
        # devices to accept an upgrade, so every tag needs a version bump.
        run: |
          set -euo pipefail
          conf_version="$(jq -r .version crates/mobile/tauri.conf.json)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$conf_version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match crates/mobile/tauri.conf.json version $conf_version" >&2
            echo "Bump the version in tauri.conf.json before tagging." >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install stable Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        env:
          PUBLIC_API_BASE_URL: https://buddy.osmosis.page
          PUBLIC_APP_MODE: tauri
        run: |
          npm ci
          npm run build

      - name: Install Tauri CLI
        # Prebuilt binary via cargo-binstall (seconds, vs 5-10 min for
        # `cargo install`). Must be the cargo subcommand, NOT the npm CLI:
        # the generated Gradle project records how the CLI was invoked and
        # re-runs it from crates/mobile during :app:rustBuild*, and the npm
        # global shim gets recorded as `node tauri`, which fails there
        # ("Cannot find module .../crates/mobile/tauri"). `cargo tauri`
        # resolves from PATH regardless of working directory.
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y 'tauri-cli@^2'

      - name: Export Android NDK env
        # ANDROID_HOME is preset by the runner image; ANDROID_NDK_LATEST_HOME
        # is a machine env var not visible to the ${{ env }} context, so
        # re-export it under the name the Tauri CLI expects.
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Generate Android project
        working-directory: crates/mobile
        run: cargo tauri android init --skip-targets-install

      - name: Apply the committed launcher icons
        working-directory: crates/mobile
        run: |
          set -euo pipefail
          # `tauri android init` regenerates gen/ with DEFAULT Tauri launcher
          # icons; overlay our committed icons so the APK shows the real app icon.
          cp -r icons/android/. gen/android/app/src/main/res/

      - name: Inject Firebase config (google-services.json + Google Services Gradle plugin)
        working-directory: crates/mobile
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail
          # FCM push RECEIVING needs two things wired into the CI-generated
          # gen/android project: (1) google-services.json (maps the APK to the
          # Firebase project ai-buddy-4063c / dev.aibuddy.app) and (2) the Google
          # Services Gradle plugin, which turns that JSON into the google_app_id /
          # google_api_key string resources the Firebase SDK reads at runtime.
          # The FCM SDK itself is already bundled by the tauri-plugin-notifications
          # `push-notifications` feature (its Android library module), so we inject
          # ONLY these two things here. Mirrors the launcher-icon overlay above:
          # gen/ is regenerated by `tauri android init` every run and not
          # committed, so this must run after init and before the build.
          if [ -z "${GOOGLE_SERVICES_JSON_B64:-}" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON_B64 secret is empty - skipping Firebase wiring. FCM push will NOT work in this APK (expected on forks / repos without the secret); the build otherwise succeeds."
            exit 0
          fi

          ROOT_GRADLE=gen/android/build.gradle.kts
          APP_GRADLE=gen/android/app/build.gradle.kts
          GS_JSON=gen/android/app/google-services.json
          GS_CLASSPATH='classpath("com.google.gms:google-services:4.4.2")'
          APPLY_LINE='apply(plugin = "com.google.gms.google-services")'
          # Anchor inside buildscript { dependencies { } } that the Tauri android
          # template always emits. If it ever disappears (template change), fail
          # loudly so FCM breakage surfaces in CI instead of silently shipping.
          CLASSPATH_ANCHOR='classpath("org.jetbrains.kotlin:kotlin-gradle-plugin'

          # (1) google-services.json
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > "$GS_JSON"
          if ! grep -q '"project_info"' "$GS_JSON"; then
            echo "::error::Decoded google-services.json is invalid (no \"project_info\" key). Check that GOOGLE_SERVICES_JSON_B64 is the base64 of the Firebase google-services.json." >&2
            exit 1
          fi

          # (2a) Google Services classpath in the root buildscript.
          if grep -qF "$GS_CLASSPATH" "$ROOT_GRADLE"; then
            echo "google-services classpath already present in $ROOT_GRADLE"
          else
            if ! grep -qF "$CLASSPATH_ANCHOR" "$ROOT_GRADLE"; then
              echo "::error::Anchor not found in $ROOT_GRADLE: $CLASSPATH_ANCHOR -- the Tauri android template changed; update this Firebase injection step." >&2
              exit 1
            fi
            sed -i "/classpath(\"org.jetbrains.kotlin:kotlin-gradle-plugin/a\\        $GS_CLASSPATH" "$ROOT_GRADLE"
            grep -qF "$GS_CLASSPATH" "$ROOT_GRADLE" || { echo "::error::Failed to insert google-services classpath into $ROOT_GRADLE." >&2; exit 1; }
          fi

          # (2b) Apply the Google Services plugin at the end of the app module.
          if [ ! -f "$APP_GRADLE" ]; then
            echo "::error::$APP_GRADLE not found -- the Tauri android template changed; update this Firebase injection step." >&2
            exit 1
          fi
          if grep -qF "$APPLY_LINE" "$APP_GRADLE"; then
            echo "google-services plugin already applied in $APP_GRADLE"
          else
            printf '\n%s\n' "$APPLY_LINE" >> "$APP_GRADLE"
          fi

          echo "Firebase wiring injected OK:"
          echo "  $GS_JSON ($(wc -c < "$GS_JSON") bytes)"
          grep -nF "$GS_CLASSPATH" "$ROOT_GRADLE"
          grep -nF "$APPLY_LINE" "$APP_GRADLE"

      - name: Build unsigned release APK (arm64 + arm)
        working-directory: crates/mobile
        run: cargo tauri android build --apk --target aarch64 --target armv7

      - name: Sign APK (zipalign + apksigner)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          APK_DIR=crates/mobile/gen/android/app/build/outputs/apk/universal/release
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          # zipalign must run before apksigner (apksigner preserves alignment)
          "$BT/zipalign" -f -p 4 \
            "$APK_DIR/app-universal-release-unsigned.apk" \
            "$RUNNER_TEMP/app-aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out "ai-buddy-${{ github.ref_name }}.apk" \
            "$RUNNER_TEMP/app-aligned.apk"
          "$BT/apksigner" verify --print-certs "ai-buddy-${{ github.ref_name }}.apk"
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ai-buddy-${{ github.ref_name }}.apk
          generate_release_notes: true
